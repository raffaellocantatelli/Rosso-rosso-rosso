name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # I test della memoria usano solo la stdlib: nessun pip install,
      # cosi' restano eseguibili anche se le dipendenze di rete non ci sono.
      - name: Esegui i test
        run: python -m unittest discover -s tests -t . -v
