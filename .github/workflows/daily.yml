name: SDQ-1 Daily Run

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      prova:
        description: "Esegue senza committare: il daily finisce nel log, non nel repository"
        type: boolean
        default: false
      modello:
        description: "Modello locale da provare al posto di quello predefinito (es. gemma3:12b)"
        type: string
        default: ""

permissions:
  contents: write

# Il Core locale. Dal 02/09 al 13/11/2026 il daily e' stato Stub perche' nei
# secrets non e' mai arrivata una chiave. Quando nessuna chiave c'e', questa
# run accende un modello aperto sul runner stesso (Ollama): nessun secret,
# nessun fornitore, nessun costo — il repository e' pubblico. Chi ha una
# chiave viene sempre prima: il locale e' l'ultimo passo prima dello Stub.
# Il modello e' piccolo e gira su CPU: il daily dice nel file chi lo ha pensato.
env:
  OLLAMA_MODEL: ${{ inputs.modello || 'gemma3:4b' }}
  LLM_TIMEOUT: "900"

jobs:
  daily-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Il Core è acceso?
        id: core
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m sdq1 --check

      # Solo se nessuna chiave ha acceso il Core. Il contesto va alzato a mano:
      # con quello predefinito il prompt del daily (i DATI) verrebbe troncato
      # in silenzio e il modello risponderebbe senza averli letti.
      - name: Accendi il Core locale (Ollama sul runner)
        id: locale
        if: steps.core.outcome == 'failure'
        continue-on-error: true
        run: |
          docker run -d --name ollama -p 11434:11434 \
            -e OLLAMA_CONTEXT_LENGTH=16384 ollama/ollama
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
          docker exec ollama ollama pull "$OLLAMA_MODEL"
          docker exec ollama ollama list
          python -m sdq1 --check

      - name: Avviso — Core spento
        if: steps.core.outcome == 'failure' && steps.locale.outcome != 'success'
        run: |
          echo "::warning title=Core spento::Nessun provider LLM disponibile: \
          nessuna chiave nei secrets, e il modello locale non si e' acceso \
          (vedi il passo precedente). \
          La riflessione di oggi sarà uno Stub: attività senza pensiero."

      - name: Integrità Layer 4 (nodi concorrenti)
        id: integrita
        continue-on-error: true
        run: python manifesto_integrita.py --verifica

      - name: Avviso — manifesto disallineato
        if: steps.integrita.outcome == 'failure'
        run: |
          echo "::warning title=Layer 4 disallineato::Il manifesto SHA-256 non \
          copre piu' lo stato del repository. Un nodo ha aggiunto o modificato \
          file senza rigenerarlo: il livello che deve accorgersi delle \
          alterazioni non sta guardando quei file. Rigenera con \
          'python manifesto_integrita.py' e committa."

      # Diagnostica: dice SE un secret esiste, mai il suo valore. Un booleano
      # non e' una chiave. Serve perche' il 02/09 la run e' risultata rossa con
      # il Core spento benche' il secret fosse stato aggiunto: senza questo
      # passo si puo' solo indovinare quale nome o quale tipo sia sbagliato.
      - name: Quali secret vede questa Action?
        run: |
          echo "GOOGLE_API_KEY presente:    ${{ secrets.GOOGLE_API_KEY != '' }}"
          echo "GEMINI_API_KEY presente:    ${{ secrets.GEMINI_API_KEY != '' }}"
          echo "ANTHROPIC_API_KEY presente: ${{ secrets.ANTHROPIC_API_KEY != '' }}"
          echo "DEEPSEEK_API_KEY presente:  ${{ secrets.DEEPSEEK_API_KEY != '' }}"
          echo "GOOGLE_APIKEY presente:     ${{ secrets.GOOGLE_APIKEY != '' }}"
          echo "GOOGLE_KEY presente:        ${{ secrets.GOOGLE_KEY != '' }}"

      - name: Esegui SDQ-1 con cascata a fallback
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p output
          DATE=$(date -u +%F)
          python -m sdq1 --daily > "output/daily_${DATE}.txt" \
            || python -m sdq1 --daily --economia > "output/daily_${DATE}.txt" \
            || python -m sdq1 --daily --locale > "output/daily_${DATE}.txt" \
            || python -m sdq1 --daily --no-api > "output/daily_${DATE}.txt"
          python -m sdq1 --health

      # Una prova non lascia tracce nel repository: serve a vedere se il Core
      # pensa su un ramo qualunque senza scrivere un daily che poi andrebbe
      # riconciliato con quello del ramo di default.
      - name: Prova — il daily nel log, non nel repository
        if: ${{ inputs.prova }}
        run: cat "output/daily_$(date -u +%F).txt"

      - name: Committa l'output
        if: ${{ !inputs.prova }}
        run: |
          git config user.name "sdq1-bot"
          git config user.email "sdq1-bot@users.noreply.github.com"
          git add output/ sdq1/memory/store.json sdq1/sar/state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: run giornaliero SDQ-1 $(date -u +%F)"
          git push

      # Proposta A del contraddittorio del 26/08, eseguita.
      # Prima di oggi una run senza provider ripiegava su --no-api, committava
      # uno Stub e finiva VERDE: 25 giorni di "tutto ok" mentre il Core non
      # aveva mai pensato. E' la definizione di lettura che non obbliga a
      # niente (latenza.py). Questo passo sta DOPO il commit: il file di oggi
      # viene salvato comunque, ma la run diventa rossa.
      - name: Il daily di oggi e' stato pensato?
        run: |
          DATE=$(date -u +%F)
          if grep -q "IL CORE È SPENTO" "output/daily_${DATE}.txt"; then
            echo "::error title=Daily Stub::La riflessione di oggi non e' stata \
            pensata da nessun modello. Il file e' stato salvato con il suo banner, \
            ma questa run e' rossa apposta: nei secrets non c'e' nessuna chiave \
            e il modello locale non ha risposto (vedi i passi precedenti)."
            exit 1
          fi
          echo "Daily generato da un provider reale."
