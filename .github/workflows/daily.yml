name: SDQ-1 Daily Run

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Il Core è acceso?
        id: core
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m sdq1 --check

      - name: Avviso — Core spento
        if: steps.core.outcome == 'failure'
        run: |
          echo "::warning title=Core spento::Nessun provider LLM disponibile. \
          La riflessione di oggi sarà uno Stub: attività senza pensiero. \
          Aggiungi ANTHROPIC_API_KEY, GOOGLE_API_KEY o DEEPSEEK_API_KEY nei \
          secrets della repository (Settings > Secrets and variables > Actions)."

      - name: Esegui SDQ-1 con cascata a fallback
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p output
          DATE=$(date -u +%F)
          PROMPT="Riflessione giornaliera del sistema SDQ-1."
          python -m sdq1 "$PROMPT" > "output/daily_${DATE}.txt" \
            || python -m sdq1 --economia "$PROMPT" > "output/daily_${DATE}.txt" \
            || python -m sdq1 --no-api "$PROMPT" > "output/daily_${DATE}.txt"
          python -m sdq1 --health

      - name: Committa l'output
        run: |
          git config user.name "sdq1-bot"
          git config user.email "sdq1-bot@users.noreply.github.com"
          git add output/ sdq1/memory/store.json sdq1/sar/state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: run giornaliero SDQ-1 $(date -u +%F)"
          git push
